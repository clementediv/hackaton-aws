<script>
(() => {
  const scope = __SCOPE__, token = __TOKEN__, host = window.parent;
  const doc = host.document;
  host.__chatScrollEvents ??= {};
  if (host.__chatScrollEvents[scope] === token) return;
  host.__chatScrollControllers ??= {};
  host.__chatScrollControllers[scope]?.stop();
  let timer, deadline, active = true;
  const observer = new MutationObserver(schedule);
  function stop() {
    active = false;
    observer.disconnect();
    host.clearTimeout(timer);
    host.clearTimeout(deadline);
  }
  host.__chatScrollControllers[scope] = {stop};
  function scroll() {
    if (!active) return;
    const chat = doc.querySelector(scope);
    if (!chat || !chat.querySelector('[data-testid="stChatMessage"]')) return;
    host.__chatScrollEvents[scope] = token;
    let node = chat;
    // The personal assistant scrolls only its history; the public chat fills the page.
    while (node && (scope !== ".st-key-assistant_messages" ||
           (node !== doc.body && node !== doc.documentElement && !node.matches('[data-testid="stMain"], [data-testid="stAppViewContainer"], section.main')))) {
      const style = host.getComputedStyle(node);
      if (/(auto|scroll)/.test(style.overflowY)) {
        node.scrollTo({top: node.scrollHeight, behavior: 'instant'});
        if (scope === ".st-key-assistant_messages") break;
      }
      node = node.parentElement;
    }
  }
  function schedule() {
    host.clearTimeout(timer);
    timer = host.setTimeout(scroll, 80);
  }
  observer.observe(doc.body, {childList: true, subtree: true});
  schedule();
  // Only settle this message's layout; subsequent manual scrolling stays free.
  deadline = host.setTimeout(() => { scroll(); stop(); }, 1200);
})();
</script>
