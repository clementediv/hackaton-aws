<rect width="1920" height="1080" fill="#fff"/><text x="72" y="82" class="title" text-anchor="start">Del portal al acompañamiento personalizado</text><text x="72" y="126" class="subtitle" text-anchor="start">Recorrido vigente de la página · 16-10-2026 · interfaz local y conexiones con AWS</text><rect x="48" y="167" width="1824" height="190" rx="18" fill="#f1f5fa" stroke="none" stroke-width="2"/><text x="76" y="209" class="label" text-anchor="start">01 · ORIENTACIÓN</text><text x="76" y="245" class="body" text-anchor="start">Sin consultar perfil</text><rect x="360" y="197" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="515.0" y="232" class="label" text-anchor="middle">Inicio</text><text x="515.0" y="264" class="small" text-anchor="middle">Banner y navegación</text><rect x="752" y="197" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="907.0" y="232" class="label" text-anchor="middle">Asistente de IA</text><text x="907.0" y="264" class="small" text-anchor="middle">Consulta general</text><rect x="1144" y="197" width="310" height="108" rx="14" fill="#f3eeff" stroke="#ae95df" stroke-width="2"/><text x="1299.0" y="232" class="label" text-anchor="middle">Fuentes públicas</text><text x="1299.0" y="264" class="small" text-anchor="middle">Búsqueda local + Bedrock*</text><rect x="1536" y="197" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="1691.0" y="232" class="label" text-anchor="middle">Próximo paso</text><text x="1691.0" y="264" class="small" text-anchor="middle">Explicación y enlaces</text><path d="M670,251 L752,251" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1062,251 L1144,251" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1454,251 L1536,251" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="338" class="small" text-anchor="start">Home con animaciones y movimiento reducido; chat con historial público separado de los antecedentes personales.</text><rect x="48" y="379" width="1824" height="235" rx="18" fill="#f8f9fc" stroke="none" stroke-width="2"/><text x="76" y="421" class="label" text-anchor="start">02 · MI GOBIERNO</text><text x="76" y="456" class="body" text-anchor="start">Consulta personal</text><text x="76" y="490" class="body" text-anchor="start">con autorización</text><rect x="360" y="411" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="515.0" y="446" class="label" text-anchor="middle">Acceso de demo</text><text x="515.0" y="478" class="small" text-anchor="middle">Sesión de la persona</text><rect x="752" y="411" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="907.0" y="446" class="label" text-anchor="middle">Consentimiento</text><text x="907.0" y="478" class="small" text-anchor="middle">Permiso para antecedentes</text><rect x="1144" y="411" width="310" height="108" rx="14" fill="#eff5ff" stroke="#8fb2e8" stroke-width="2"/><text x="1299.0" y="446" class="label" text-anchor="middle">Beneficios y etapas</text><text x="1299.0" y="478" class="small" text-anchor="middle">Evaluación PGU en Python</text><rect x="1536" y="411" width="310" height="108" rx="14" fill="#f3eeff" stroke="#ae95df" stroke-width="2"/><text x="1691.0" y="446" class="label" text-anchor="middle">Asistente personal</text><text x="1691.0" y="478" class="small" text-anchor="middle">Contexto autorizado + fuentes</text><path d="M670,465 L752,465" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1062,465 L1144,465" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1454,465 L1536,465" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="560" class="small" text-anchor="start">Datos personales: identidad, documentos, contacto, trabajo y salud; adjuntar archivos no concede un beneficio.</text><text x="360" y="592" class="small" text-anchor="start">Seguimiento y progreso declarado se guardan localmente. Otros beneficios todavía no tienen evaluación personalizada.</text><rect x="48" y="636" width="1824" height="206" rx="18" fill="#f1f5fa" stroke="none" stroke-width="2"/><text x="76" y="678" class="label" text-anchor="start">03 · EJECUTIVO</text><text x="76" y="715" class="body" text-anchor="start">Sesión separada</text><rect x="360" y="667" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="515.0" y="702" class="label" text-anchor="middle">Acceso del equipo</text><text x="515.0" y="734" class="small" text-anchor="middle">Credenciales de demo</text><rect x="752" y="667" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="907.0" y="702" class="label" text-anchor="middle">Seguimiento y ficha</text><text x="907.0" y="734" class="small" text-anchor="middle">Casos, permisos e historial</text><rect x="1144" y="667" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="1299.0" y="702" class="label" text-anchor="middle">Mapa y campañas</text><text x="1299.0" y="734" class="small" text-anchor="middle">Ubicaciones sintéticas RM</text><rect x="1536" y="667" width="310" height="108" rx="14" fill="#eff5ff" stroke="#8fb2e8" stroke-width="2"/><text x="1691.0" y="702" class="label" text-anchor="middle">Contactos AWS</text><text x="1691.0" y="734" class="small" text-anchor="middle">DynamoDB · solo lectura</text><path d="M670,721 L752,721" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1062,721 L1144,721" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1454,721 L1536,721" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="820" class="small" text-anchor="start">La vista reúne herramientas; las flechas representan el recorrido de revisión, no una sincronización automática.</text><rect x="48" y="864" width="1824" height="130" rx="14" fill="#102945" stroke="none" stroke-width="2"/><text x="78" y="905" class="label" text-anchor="start" style="fill:#fff">MEJORAS RECIENTES DE LA PÁGINA</text><text x="78" y="944" class="body" text-anchor="start" style="fill:#fff">Datos y detalles alineados · espera animada · scroll dentro del historial · texto a 25 ms por palabra y sin cursor</text><text x="78" y="977" class="small" text-anchor="start" style="fill:#c9d9ea">Animaciones de inicio y Mi Gobierno · movimiento reducido · respuesta breve ante insultos sin arrastrar el tema PGU</text><text x="72" y="1034" class="small" text-anchor="start">* Bedrock cuando está configurado; existe respaldo local. Dictado y lectura pertenecen al navegador.</text><text x="72" y="1066" class="small" text-anchor="start">La orientación es preliminar. El organismo competente valida y resuelve. API de chat y datos AWS aún se integran por separado.</text></svg>