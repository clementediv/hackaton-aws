<rect x="48" y="164" width="1824" height="204" rx="18" fill="#f1f5fa" stroke="none" stroke-width="2"/><text x="76" y="205" class="label" text-anchor="start">01 · APP LOCAL</text><text x="76" y="240" class="body" text-anchor="start">Inicio · Mi Gobierno</text><text x="76" y="271" class="body" text-anchor="start">Asistente · Ejecutivo</text><text x="76" y="310" class="small" text-anchor="start">Streamlit / localhost</text><rect x="360" y="196" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="515.0" y="231" class="label" text-anchor="middle">Portal ciudadano</text><text x="515.0" y="263" class="small" text-anchor="middle">Chat público o personal</text><rect x="752" y="196" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="907.0" y="231" class="label" text-anchor="middle">Python + contexto</text><text x="907.0" y="263" class="small" text-anchor="middle">Permiso, reglas PGU y fuentes</text><rect x="1144" y="196" width="310" height="108" rx="14" fill="#f3eeff" stroke="#ae95df" stroke-width="2"/><text x="1299.0" y="231" class="label" text-anchor="middle">Amazon Bedrock</text><text x="1299.0" y="263" class="small" text-anchor="middle">Claude · Converse / Stream</text><path d="M670,250 L752,250" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1062,250 L1144,250" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1536" y="196" width="310" height="108" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="1691.0" y="231" class="label" text-anchor="middle">Respuesta progresiva</text><text x="1691.0" y="263" class="small" text-anchor="middle">Fuentes y próximo paso</text><path d="M1454,250 L1536,250" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="342" class="small" text-anchor="start">SQLite: casos, documentos y trazabilidad. JSON: fuentes públicas. Dictado y lectura opcional: navegador.</text><rect x="48" y="390" width="1824" height="327" rx="18" fill="#f8f9fc" stroke="none" stroke-width="2"/><text x="76" y="432" class="label" text-anchor="start">02 · CONTACTO</text><text x="76" y="465" class="label" text-anchor="start">PROACTIVO</text><text x="76" y="508" class="body" text-anchor="start">Stack AWS</text><text x="76" y="540" class="small" text-anchor="start">ChileAtiendeProactivo</text><rect x="360" y="420" width="310" height="100" rx="14" fill="#eff5ff" stroke="#8fb2e8" stroke-width="2"/><text x="515.0" y="455" class="label" text-anchor="middle">Amazon DynamoDB</text><text x="515.0" y="487" class="small" text-anchor="middle">Personas + catálogo</text><rect x="752" y="420" width="310" height="100" rx="14" fill="#fff6e8" stroke="#edb66b" stroke-width="2"/><text x="907.0" y="455" class="label" text-anchor="middle">AWS Lambda</text><text x="907.0" y="487" class="small" text-anchor="middle">Detecta con reglas Python</text><rect x="1144" y="420" width="310" height="100" rx="14" fill="#fff6e8" stroke="#edb66b" stroke-width="2"/><text x="1299.0" y="455" class="label" text-anchor="middle">Amazon SES</text><text x="1299.0" y="487" class="small" text-anchor="middle">Email a casillas verificadas</text><rect x="1536" y="420" width="310" height="100" rx="14" fill="#fff6e8" stroke="#edb66b" stroke-width="2"/><text x="1691.0" y="455" class="label" text-anchor="middle">Respuesta de la persona</text><text x="1691.0" y="487" class="small" text-anchor="middle">Lambda Function URL</text><path d="M670,470 L752,470" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="711.0" y="458.0" class="small" text-anchor="middle">Stream</text><path d="M1062,470 L1144,470" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1454,470 L1536,470" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="360" y="578" width="310" height="100" rx="14" fill="#fff6e8" stroke="#edb66b" stroke-width="2"/><text x="515.0" y="613" class="label" text-anchor="middle">Amazon EventBridge</text><text x="515.0" y="645" class="small" text-anchor="middle">Revisión diaria / cada minuto</text><rect x="752" y="578" width="310" height="100" rx="14" fill="#fff6e8" stroke="#edb66b" stroke-width="2"/><text x="907.0" y="613" class="label" text-anchor="middle">AWS Lambda</text><text x="907.0" y="645" class="small" text-anchor="middle">Revisar y escalar pendientes</text><rect x="1144" y="578" width="310" height="100" rx="14" fill="#eff5ff" stroke="#8fb2e8" stroke-width="2"/><text x="1299.0" y="613" class="label" text-anchor="middle">Amazon DynamoDB</text><text x="1299.0" y="645" class="small" text-anchor="middle">Contactos + historial</text><rect x="1536" y="578" width="310" height="100" rx="14" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="1691.0" y="613" class="label" text-anchor="middle">Panel del ejecutivo</text><text x="1691.0" y="645" class="small" text-anchor="middle">Lee AWS desde la app</text><path d="M670,628 L752,628" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1062,628 L1144,628" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1454,628 L1536,628" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1495.0" y="616.0" class="small" text-anchor="middle">Lectura</text><path d="M907,520 L907,550 L1299,550 L1299,578" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1691,520 L1691,550 L1450,550 L1450,578" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="704" class="small" text-anchor="start">Sin respuesta: email → SMS simulado → terreno. Aceptar o rechazar detiene el escalamiento; abrir no lo detiene.</text><rect x="48" y="739" width="1824" height="205" rx="18" fill="#f1f5fa" stroke="none" stroke-width="2"/><text x="76" y="780" class="label" text-anchor="start">03 · API DE CHAT</text><text x="76" y="822" class="body" text-anchor="start">Stack AWS</text><text x="76" y="854" class="small" text-anchor="start">ChileAtiendeChat</text><rect x="360" y="770" width="310" height="100" rx="14" fill="#fff6e8" stroke="#edb66b" stroke-width="2"/><text x="515.0" y="805" class="label" text-anchor="middle">API Gateway</text><text x="515.0" y="837" class="small" text-anchor="middle">HTTPS + clave de API</text><rect x="752" y="770" width="310" height="100" rx="14" fill="#fff6e8" stroke="#edb66b" stroke-width="2"/><text x="907.0" y="805" class="label" text-anchor="middle">AWS Lambda</text><text x="907.0" y="837" class="small" text-anchor="middle">Agente y evaluación PGU</text><rect x="1144" y="770" width="310" height="100" rx="14" fill="#f3eeff" stroke="#ae95df" stroke-width="2"/><text x="1299.0" y="805" class="label" text-anchor="middle">Amazon Bedrock</text><text x="1299.0" y="837" class="small" text-anchor="middle">Genera la explicación</text><rect x="1536" y="770" width="310" height="100" rx="14" fill="#eff5ff" stroke="#8fb2e8" stroke-width="2"/><text x="1691.0" y="805" class="label" text-anchor="middle">Amazon DynamoDB</text><text x="1691.0" y="837" class="small" text-anchor="middle">Casos + consentimiento</text><path d="M670,820 L752,820" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1062,820 L1144,820" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M907,870 L907,893 L1691,893 L1691,870" stroke="#60738d" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="925" class="small" text-anchor="start">API separada: el frontend local todavía utiliza su adaptador directo a Bedrock. La Lambda persiste casos e historial.</text><rect x="48" y="968" width="1824" height="75" rx="14" fill="#102945" stroke="none" stroke-width="2"/><text x="78" y="999" class="small" text-anchor="start" style="fill:#fff">SOPORTE: IAM · permisos  |  Secrets Manager · claves de API  |  CloudWatch · logs  |  CDK / CloudFormation · despliegue</text><text x="78" y="1028" class="small" text-anchor="start" style="fill:#c9d9ea">La IA explica. El código calcula elegibilidad y plazos. Las bases locales y AWS aún no están completamente unificadas.</text><text x="1844" y="1067" class="small" text-anchor="end">16-10-2026 · Todas las ramas revisadas; despliegue AWS sin revalidar en vivo.</text></svg>