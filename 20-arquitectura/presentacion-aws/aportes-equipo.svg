<rect width="1920" height="1080" fill="#fff"/><text x="72" y="82" class="title" text-anchor="start">Aportes consolidados del equipo</text><text x="72" y="127" class="subtitle" text-anchor="start">Cinco integrantes · revisión de todas las ramas remotas · 16-10-2026</text><rect x="48" y="177" width="1824" height="126" rx="18" fill="#f1f5fa" stroke="none" stroke-width="2"/><text x="80" y="223" class="label" text-anchor="start">Johann</text><text x="360" y="216" class="label" text-anchor="start">Base de la aplicación y motor de rutas</text><text x="360" y="252" class="body" text-anchor="start">Portal, Mi Gobierno, reglas PGU y catálogo público para el asistente.</text><text x="360" y="284" class="small" text-anchor="start">0d06dab · ad7efb0</text><text x="1825" y="282" class="small" text-anchor="end">Código integrado</text><rect x="48" y="321" width="1824" height="126" rx="18" fill="#f8f9fc" stroke="none" stroke-width="2"/><text x="80" y="367" class="label" text-anchor="start">Clemente</text><text x="360" y="360" class="label" text-anchor="start">Detección, contacto y seguimiento</text><text x="360" y="396" class="body" text-anchor="start">Flujo proactivo AWS, colador local, campañas, ficha y trazabilidad.</text><text x="360" y="428" class="small" text-anchor="start">edb8191 · 96abb06</text><text x="1825" y="426" class="small" text-anchor="end">Código integrado</text><rect x="48" y="465" width="1824" height="126" rx="18" fill="#f1f5fa" stroke="none" stroke-width="2"/><text x="80" y="511" class="label" text-anchor="start">Jonmor</text><text x="360" y="504" class="label" text-anchor="start">API del chat y continuidad conversacional</text><text x="360" y="540" class="body" text-anchor="start">Casos DynamoDB, consentimiento, Bedrock, pruebas, memoria y voz.</text><text x="360" y="572" class="small" text-anchor="start">df99c3b · 7ba7c2f</text><text x="1825" y="570" class="small" text-anchor="end">Código integrado</text><rect x="48" y="609" width="1824" height="126" rx="18" fill="#f8f9fc" stroke="none" stroke-width="2"/><text x="80" y="655" class="label" text-anchor="start">Bruno</text><text x="360" y="648" class="label" text-anchor="start">Investigación y diseño de la experiencia</text><text x="360" y="684" class="body" text-anchor="start">Contexto de personas mayores, accesibilidad y propuestas de flujo.</text><text x="360" y="716" class="small" text-anchor="start">f4ca21c · d9eb707</text><text x="1825" y="714" class="small" text-anchor="end">Documentación integrada</text><rect x="48" y="753" width="1824" height="126" rx="18" fill="#f1f5fa" stroke="none" stroke-width="2"/><text x="80" y="799" class="label" text-anchor="start">Jp</text><text x="360" y="792" class="label" text-anchor="start">Experiencia de usuario y presentación</text><text x="360" y="828" class="body" text-anchor="start">Estilo visual, micrófono, respuestas progresivas y material del pitch.</text><text x="360" y="860" class="small" text-anchor="start">8909d96 · 3d2f6d2</text><text x="1825" y="858" class="small" text-anchor="end">Código y material integrados</text><rect x="48" y="923" width="1824" height="102" rx="14" fill="#102945" stroke="none" stroke-width="2"/><text x="78" y="963" class="label" text-anchor="start" style="fill:#fff">UNA SOLUCIÓN COMPARTIDA</text><text x="78" y="1000" class="body" text-anchor="start" style="fill:#fff">Detectar → contactar → autorizar → orientar → acompañar → seguimiento del ejecutivo</text><text x="72" y="1066" class="small" text-anchor="start">Los aportes se superponen. Las propuestas de investigación no equivalen a funciones implementadas.</text></svg>