[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chileatiende-a-tiempo"
version = "0.1.0"
description = "MVP de orientación para jubilación y PGU con continuidad entre canales"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
agente = "src.agent.cli:main"

[dependency-groups]
api = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "openinference-instrumentation-bedrock>=0.1,<1"]
eval = ["deepeval>=3,<4"]
app = [
    "streamlit==1.40.1",
    "pandas==2.2.3",
]
dev = [
    "moto[dynamodb,ses]>=5,<6",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
infra = [
    "aws-cdk-lib>=2.170,<3",
    "constructs>=10,<11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.app" = ["assets/*.svg", "assets/*.geojson", "assets/*.html", "assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -p no:deepeval -m "not eval"'
markers = ["eval: evaluación explícita con Bedrock real (consume tokens)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
